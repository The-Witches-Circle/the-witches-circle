<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost in the Circle — The Witches Circle</title>
  <meta name="description" content="This page could not be found." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .notfound {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.5rem;
    }

    .notfound-code {
      font-family: var(--font-game);
      font-size: clamp(4rem, 16vw, 8rem);
      line-height: 1;
      color: var(--color-accent);
      margin: 0;
    }

    .notfound-title {
      font-family: var(--font-heading);
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--color-accent-2);
    }

    .notfound-text {
      color: var(--color-muted);
      max-width: 34rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <h1 class="logo">
        <a href="/"><img src="/assets/images/studio-logo.png" alt="The Witches Circle" class="logo-img" width="1893" height="502" /></a>
      </h1>
      <p class="tagline">Indie Game Studio</p>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container notfound">
        <p class="notfound-code">404</p>
        <p class="notfound-title">This page has vanished from the circle.</p>
        <p class="notfound-text">
          The page you were looking for was moved, renamed, or never existed at all.
        </p>
        <a href="/" class="game-btn">Return to the Circle</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 The Witches Circle. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
